name: Frontend build

# The Docker workflows only run on pushes, so nothing builds a pull request
# before it lands on main. Building is quick, needs no secrets, and fails on a
# message key that doesn't exist (see astro.config.mjs), which would otherwise
# only throw when the page renders.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
