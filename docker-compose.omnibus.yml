services:
  scrob:
    container_name: scrob
    image: bellamy/scrob:latest-omnibus
    restart: unless-stopped
    ports:
      - "7330:7330"
    environment:
      # ── Security ────────────────────────────────────────────────────────────
      # Generate with: openssl rand -hex 32
      SECRET_KEY: changeme

      # ── Registrations ────────────────────────────────────────────────────────
      # Registrations are disabled by default. Set to true to allow additional users.
      # ENABLE_REGISTRATIONS: "true"
      # REGISTRATION_MAX_ALLOWED_USERS: "0"  # 0 = unlimited

      # Days a login lasts when "Stay logged in" is ticked (7 days otherwise)
      # SESSION_REMEMBER_DAYS: "30"

      # ── Nuvio (optional) ───────────────────────────────────────────────────
      # Set this to the anon/public key when using a self-hosted Nuvio backend.
      # NUVIO_APP_ANON_KEY: ""

      # ── ARVIO (optional) ────────────────────────────────────────────────────
      # Overrides the embedded public anon key for auth.arvio.tv. Leave unset
      # to use the official key.
      # ARVIO_APP_ANON_KEY: ""

      # ── OIDC (optional) ─────────────────────────────────────────────────────
      # OIDC_ENABLED: "false"
      # OIDC_PROVIDER_NAME: SSO
      # OIDC_CLIENT_ID: ""
      # OIDC_CLIENT_SECRET: ""
      # OIDC_AUTH_URL: ""
      # OIDC_TOKEN_URL: ""
      # OIDC_USERINFO_URL: ""
      # OIDC_REDIRECT_URL: http://your-server:7330/oidc-callback
      # OIDC_DISCOVERY_URL: https://your-idp.example.com/.well-known/openid-configuration   # recommended — enables id_token verification + (issuer, sub) binding
      # OIDC_ISSUER: ""        # explicit fallback when discovery isn't available
      # OIDC_JWKS_URL: ""      # explicit fallback when discovery isn't available
      # OIDC_LOGOUT_URL: ""    # end_session endpoint; populated from discovery when unset
      # OIDC_POST_LOGOUT_REDIRECT_URL: ""   # defaults to SERVER_URL + /login
      # OIDC_SCOPES: "openid email profile"
      # OIDC_IDENTIFIER_FIELD: email         # only used in compat (no-discovery) mode
      # OIDC_AUTO_CREATE_USERS: "true"
      # OIDC_DISABLE_PASSWORD_LOGIN: "false"
      # OIDC_PKCE: "true"      # escape hatch; leave on unless the IdP breaks on PKCE

      # ── User & timezone ──────────────────────────────────────────────────────
      # Run the process as a specific user/group (defaults to 1000:1000)
      # PUID: "1000"
      # PGID: "1000"
      TZ: UTC

      # ── Advanced ─────────────────────────────────────────────────────────────
      # To use an external PostgreSQL instance instead of the embedded one,
      # set DATABASE_URL and the embedded database will be skipped entirely.
      # DATABASE_URL: postgresql+asyncpg://user:password@host:5432/scrob

      # Override the internal backend port (only needed if 7331 conflicts on bare metal)
      # BACKEND_PORT: "7331"
    volumes:
      - scrob_data:/app/backend/data
      - scrob_db:/app/postgres/data

volumes:
  scrob_data:
  scrob_db:
